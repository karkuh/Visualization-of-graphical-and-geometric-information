<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Virich Cyclic Surface — WebGL</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1e1e1e;
        color: #eee;
        height: 100vh;
        display: flex;
        flex-direction: row;
    }

    #sidebar {
        width: 280px;
        background-color: #2c2c2c;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: 3px 0 10px rgba(0,0,0,0.5);
    }

    #sidebar h2 {
        font-size: 20px;
        margin-bottom: 12px;
        text-align: center;
    }

    #sidebar label {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        margin-bottom: 6px;
    }

    #sidebar input[type="number"], #sidebar input[type="color"] {
        width: 80px;
        padding: 2px 4px;
        border-radius: 4px;
        border: 1px solid #555;
        background-color: #3a3a3a;
        color: #eee;
    }

    #sidebar input[type="radio"] {
        margin-right: 6px;
    }

    #sidebar button {
        padding: 6px 12px;
        background-color: #ff8800;
        border: none;
        border-radius: 4px;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    #sidebar button:hover {
        background-color: #ffaa33;
    }

    #canvas-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #111;
    }

    canvas {
        width: 100%;
        height: 100%;
        border: 2px solid #444;
        background-color: #111;
    }

    .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
    }
</style>
</head>
<body onload="init()">

<div id="sidebar">
    <h2>Surface parameters</h2>

    <label>a: <input id="paramA" type="number" value="1.5" step="0.1"></label>
    <label>b: <input id="paramB" type="number" value="3" step="0.1"></label>
    <label>c: <input id="paramC" type="number" value="2" step="0.1"></label>
    <label>d: <input id="paramD" type="number" value="4" step="0.1"></label>
    <label>uSteps: <input id="paramT" type="number" value="40" step="1" min="4"></label>
    <label>vSteps: <input id="paramV" type="number" value="60" step="1" min="4"></label>

    <div class="control-group">
        <button onclick="updateSurface()">Update surface</button>
        <button onclick="resetView()">Reset view</button>
    </div>

    <div class="control-group">
        <span>Render mode:</span>
        <label><input type="radio" name="renderMode" value="lines" checked onchange="draw()"> Lines</label>
        <label><input type="radio" name="renderMode" value="triangles" onchange="draw()"> Triangles</label>
    </div>

    <div class="control-group">
    <span>U range:</span>
    <label><input type="radio" name="tRange" value="pi" onchange="updateSurface()"> 0..π</label>
    <label><input type="radio" name="tRange" value="2pi" checked onchange="updateSurface()"> 0..2π</label>
    </div>

    <div class="control-group">
    <span>V range:</span>
    <label><input type="radio" name="vRange" value="pi"  onchange="updateSurface()"> 0..π</label>
    <label><input type="radio" name="vRange" value="2pi" checked onchange="updateSurface()"> 0..2π</label>
    </div>  



    <div class="control-group">
        <label>Color: <input type="color" id="colorPicker" value="#e67333" onchange="draw()"></label>
    </div>
</div>

<div id="canvas-container">
    <canvas id="webglcanvas"></canvas>
</div>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./main.js"></script>

</body>
</html>
