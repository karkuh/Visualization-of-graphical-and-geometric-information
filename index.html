<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Virich Cyclic Surface — WebGL</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ccc;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        #sidebar {
            width: 300px;
            background-color: #252526;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.3);
            overflow-y: auto;
            font-size: 13px;
        }

        .section-title {
            font-weight: bold;
            color: #fff;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        input[type="number"], input[type="text"] {
            background-color: #3c3c3c;
            border: 1px solid #555;
            color: #eee;
            border-radius: 3px;
            padding: 2px 5px;
            width: 60px;
            text-align: right;
        }

        input[type="range"] {
            flex: 1;
            margin-left: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        button {
            flex: 1;
            padding: 8px;
            background-color: #ff8800;
            border: none;
            border-radius: 3px;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #ff880084;
        }

        .xyz-group {
            display: flex;
            gap: 5px;
        }
        .xyz-group label {
            justify-content: flex-start;
            gap: 5px;
        }
        .xyz-group input {
            width: 40px;
        }

        #canvas-container {
            flex: 1;
            background-color: #111;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .info-value {
            color: #ff8800;
            font-family: monospace;
        }
    </style>
</head>
<body onload="init()">

<div id="sidebar">

    <div class="control-group">
        <div class="section-title">Surface Parameters</div>
        <label>a: <input id="paramA" type="number" value="1.5" step="0.1"></label>
        <label>b: <input id="paramB" type="number" value="3" step="0.1"></label>
        <label>c: <input id="paramC" type="number" value="2" step="0.1"></label>
        <label>d: <input id="paramD" type="number" value="4" step="0.1"></label>
        <label>U Steps: <input id="paramU" type="number" value="60" step="1" min="4"></label>
        <label>V Steps: <input id="paramV" type="number" value="60" step="1" min="4"></label>
        
        <div class="btn-group">
            <button onclick="updateSurface()">Build</button>
            <button onclick="resetView()">Reset View</button>
        </div>
    </div>

    <div class="control-group">
        <div class="section-title">Rendering</div>
        
        <label>
            <span>Mode:</span>
            <div>
                <label style="display:inline;"><input type="radio" name="renderMode" value="lines" onchange="updateRenderSettings()"> Lines</label>
                <label style="display:inline; margin-left:5px;"><input type="radio" name="renderMode" value="triangles" checked onchange="updateRenderSettings()"> Fill</label>
            </div>
        </label>

        <label><input type="checkbox" id="showAxes" checked> Show Axes</label>
    </div>

    <div class="control-group">
        <div class="section-title">Textures</div>
        <label><input type="checkbox" id="useDiffuseMap" checked onchange="updateRenderSettings()"> Diffuse</label>
        <label><input type="checkbox" id="useSpecularMap" checked onchange="updateRenderSettings()"> Specular</label>
        <label><input type="checkbox" id="useNormalMap" checked onchange="updateRenderSettings()"> Normal</label>
    </div>

    <div class="control-group">
        <div class="section-title">Lighting</div>
        <label><input type="checkbox" id="enableLighting" checked onchange="updateRenderSettings()"> Enable Light</label>
        
        <div style="margin-top:5px;">
            <label><input type="radio" name="lightMode" value="static" checked onchange="updateRenderSettings()"> Static (World)</label>
            <label><input type="radio" name="lightMode" value="dynamic" onchange="updateRenderSettings()"> Dynamic (Camera)</label>
        </div>
    </div>

    <div class="control-group">
        <div class="section-title">Transformation</div>
        
        <label>Rotation: <input id="geoAngle" type="range" min="0" max="360" value="0" step="1"></label>
        
        <div style="margin: 8px 0 4px 0; border-top: 1px solid #333; padding-top:5px;">
            <strong>Pivot Source:</strong>
        </div>
        
        <label><input type="radio" name="pivotMode" value="surface" checked> Surface (U,V)</label>
        <div style="padding-left: 20px; font-size: 11px; margin-bottom: 5px;">
            Current: <span id="pivotDisplay" class="info-value">0.00, 0.00</span>
            <br><span style="color:#666">(Use WASD keys)</span>
        </div>

        <label><input type="radio" name="pivotMode" value="custom"> Custom (X,Y,Z)</label>
        <div class="xyz-group" style="padding-left: 20px;">
            <label>X <input id="custX" type="number" value="0" step="0.5"></label>
            <label>Y <input id="custY" type="number" value="0" step="0.5"></label>
            <label>Z <input id="custZ" type="number" value="0" step="0.5"></label>
        </div>
    </div>

</div>

<div id="canvas-container">
    <canvas id="webglcanvas"></canvas>
</div>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./main.js"></script>

</body>
</html>
